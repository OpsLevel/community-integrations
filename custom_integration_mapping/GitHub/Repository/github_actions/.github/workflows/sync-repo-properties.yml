name: sync-repo-properties

# Sets this repository's GitHub custom properties from .github/repo-properties.yml on every change to it on main.
# OpsLevel reads them on its next sync (GitHub Repository components / Service properties, Risk Priority).
# Needs, in your GitHub org:
#   - custom properties data_classification and external_interface_type with
#     "Allow repository actors to set this property" turned on;
#   - org secret REPO_PROPERTIES_TOKEN: a GitHub App or fine-grained token with the repository permission
#     "Custom properties: Read and write" on the org's repositories.
# Changes to the properties file need security review (CODEOWNERS).

on:
  push:
    branches: [main]
    paths: ['.github/repo-properties.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set custom property values
        env:
          GH_TOKEN: ${{ secrets.REPO_PROPERTIES_TOKEN }}
        run: |
          body=$(yq -o=json '{"properties": (to_entries | map({"property_name": .key, "value": (.value | tostring)}))}' .github/repo-properties.yml)
          echo "$body"
          gh api --method PATCH "repos/${{ github.repository }}/properties/values" --input - <<<"$body"
