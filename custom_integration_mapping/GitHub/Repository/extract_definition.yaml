---
# Pull every repository in your GitHub org. Replace <your_github_org> with your org's login.
# 100 repos per page, following GitHub's Link header (rel="next") until the last page.
# Secret github_api_token: fine-grained PAT, your org as resource owner, All repositories,
# Repository permission "Metadata: Read" (covers private repos and custom_properties).
extractors:
- external_kind: github_repos
  external_id: ".id | tostring"
  iterator: "."
  http_polling:
    method: GET
    url: '{% if cursor %}{{ cursor }}{% else %}https://api.github.com/orgs/<your_github_org>/repos?per_page=100&type=all{% endif %}'
    headers:
    - name: Authorization
      value: Bearer {{ 'github_api_token' | secret }}
    - name: Accept
      value: application/vnd.github+json
    - name: X-GitHub-Api-Version
      value: '2022-11-28'
    # Follow GitHub's Link header (rel="next") until the last page.
    next_cursor:
      from: header
      value: '.link.next.target_url // null'
